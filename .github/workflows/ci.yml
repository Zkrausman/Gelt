name: Gelt Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'

      - name: Install dependencies
        run: go mod download

      - name: Verify build compilation
        run: go build -v ./...

      - name: Execute tests
        run: go test -v -race ./...

      - name: Vet Go packages
        run: go vet ./...
