name: V2 offline foundation
on:
  push:
    branches: [master]
    paths:
      - 'v2/**'
      - 'research/paper2agent/**'
      - 'tests/research-browser/**'
      - 'docs/specs/ZAR-209-Private-Reference-Evidence.md'
      - 'docs/specs/ZAR-231-Research-Evidence-Read-View.md'
      - 'docs/specs/Offline-Research-Playwright-Acceptance.md'
      - '.gitattributes'
      - '.github/workflows/v2.yml'
  pull_request:
    branches: [master]
    paths:
      - 'v2/**'
      - 'research/paper2agent/**'
      - 'tests/research-browser/**'
      - 'docs/specs/ZAR-209-Private-Reference-Evidence.md'
      - 'docs/specs/ZAR-231-Research-Evidence-Read-View.md'
      - 'docs/specs/Offline-Research-Playwright-Acceptance.md'
      - '.gitattributes'
      - '.github/workflows/v2.yml'
permissions:
  contents: read
jobs:
  node-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm --prefix v2 ci --no-audit --no-fund
      - run: npm --prefix v2 test
      - run: npm --prefix v2 run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm --prefix v2 run test:smoke
      - name: Running Next history acceptance (sandboxed browser, synthetic offline fixtures)
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser" && test -x "$browser"
          printf 'Sandboxed browser executable: %s\n' "$browser"
          realpath "$browser"
          "$browser" --version
          printf 'GELT_TEST_BROWSER_PATH=%s\n' "$browser" >> "$GITHUB_ENV"
          GELT_TEST_BROWSER_PATH="$browser" node v2/scripts/running-next-history-acceptance.mjs --offline-test-only
        env:
          NODE_ENV: test
          GELT_OFFLINE_HISTORY: fixture-only
          GELT_HISTORY_SCREENSHOTS: ${{ runner.temp }}/gelt-history-evidence
      - name: Built Next private research HTTP acceptance (actual reference evidence)
        run: node v2/scripts/running-next-research-read-smoke.mjs --offline-test-only
        env:
          NODE_ENV: test
          GELT_OFFLINE_RESEARCH: fixture-only
      - name: Install isolated pinned Playwright test tooling
        run: npm --prefix tests/research-browser ci --ignore-scripts --no-audit --no-fund
      - name: Running Next research Playwright acceptance (sandboxed browser)
        run: |
          test -n "$GELT_TEST_BROWSER_PATH" && test -x "$GELT_TEST_BROWSER_PATH"
          printf 'Reusing validated sandboxed history browser: %s\n' "$GELT_TEST_BROWSER_PATH"
          "$GELT_TEST_BROWSER_PATH" --version
          node tests/research-browser/run.mjs --offline-test-only
        env:
          NODE_ENV: test
          GELT_OFFLINE_RESEARCH: fixture-only
          GELT_RESEARCH_SCREENSHOTS: ${{ runner.temp }}/gelt-research-playwright
      - name: Prepare private G01 browser fixture parent
        run: mkdir -m 700 "${RUNNER_TEMP}/gelt-g01-private-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: G01 synthetic owner entry and protected research browser regression
        run: node v2/tests/research-owner-entry/run.mjs
        env:
          GELT_TEST_APP_ROOT: ${{ github.workspace }}/v2
          GELT_TEST_SOURCE_ROOT: ${{ github.workspace }}
          GELT_TEST_PLAYWRIGHT_ROOT: ${{ github.workspace }}/tests/research-browser
          GELT_TEST_BROWSER_PATH: ${{ env.GELT_TEST_BROWSER_PATH }}
          GELT_TEST_BROWSERS_PATH: ${{ runner.temp }}/gelt-g01-browsers
          GELT_TEST_PRIVATE_PARENT: ${{ runner.temp }}/gelt-g01-private-${{ github.run_id }}-${{ github.run_attempt }}
          GELT_TEST_SOURCE_BASE: 9debdf6d055137d4f4f6e0121bd5930a43e18755
      - name: Remove empty private G01 browser fixture parent after verified success
        if: ${{ success() }}
        run: rmdir -- "${RUNNER_TEMP}/gelt-g01-private-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: G03 recorded simulation terminal protected browser acceptance
        run: node v2/tests/simulation-terminal/run.mjs --offline-test-only
        env:
          NODE_ENV: test
          GELT_SYNTHETIC_ORDER_HARNESS: offline-test-only
          GELT_SYNTHETIC_MOCK_ROBINHOOD: offline-test-only
          GELT_TEST_BROWSER_PATH: ${{ env.GELT_TEST_BROWSER_PATH }}
          GELT_SIMULATION_SCREENSHOTS: ${{ runner.temp }}/gelt-simulation-terminal
      - name: Retain G03 recorded fixture browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-simulation-terminal-${{ github.sha }}
          path: ${{ runner.temp }}/gelt-simulation-terminal
          if-no-files-found: error
          retention-days: 7
      - name: Retain private research Playwright evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-research-playwright-${{ github.sha }}
          path: ${{ runner.temp }}/gelt-research-playwright
          if-no-files-found: error
          retention-days: 7
      - name: Retain private synthetic browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-history-browser-${{ github.sha }}
          path: ${{ runner.temp }}/gelt-history-evidence
          if-no-files-found: error
          retention-days: 7
  scientific-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install official pinned uv tooling
        run: python -m pip install uv==0.12.19
      - name: Reproduce locked local scientific MCP operation
        working-directory: research/paper2agent
        run: |
          uv sync --frozen --no-install-project
          .venv/bin/python -m pytest -q
          .venv/bin/python verify.py "${RUNNER_TEMP}/gelt-reference-replay"
      - name: Build hash-bound G04 source package and verify fresh extraction
        working-directory: research/paper2agent
        run: |
          .venv/bin/python delivery.py build "${RUNNER_TEMP}/gelt-paper-package" --source-commit "${GITHUB_SHA}"
          package_sha="$(.venv/bin/python -c 'import json,os;from pathlib import Path;print(json.loads((Path(os.environ["RUNNER_TEMP"])/"gelt-paper-package/package-receipt.json").read_text())["archive_sha256"])')"
          .venv/bin/python delivery.py extract "${RUNNER_TEMP}/gelt-paper-package/paper-package.zip" "$package_sha" "${RUNNER_TEMP}/gelt-paper-extracted" > "${RUNNER_TEMP}/gelt-paper-package/extraction-receipt.json"
          cd "${RUNNER_TEMP}/gelt-paper-extracted"
          uv sync --frozen --no-install-project
          .venv/bin/python -m pytest -q
          .venv/bin/python verify.py "${RUNNER_TEMP}/gelt-paper-package/fresh-reference"
          .venv/bin/python parity.py "${RUNNER_TEMP}/gelt-paper-package/paper-package.zip" "$package_sha" "${RUNNER_TEMP}/gelt-paper-package/parity-receipt.json"
      - name: Retain G04 package, extraction and real MCP case receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: paper-package-${{ github.sha }}
          path: ${{ runner.temp }}/gelt-paper-package
          if-no-files-found: error
          retention-days: 7
      - name: Retain private reproducibility output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: scientific-reference-${{ github.sha }}
          path: ${{ runner.temp }}/gelt-reference-replay
          if-no-files-found: error
          retention-days: 7
