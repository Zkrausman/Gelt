[package]
name = "gelt-codex-thread-preparation"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
autobins = false
autoexamples = false
autobenches = false
autotests = false

[lib]
path = "src/lib.rs"
doctest = false

# Standalone review candidate. No Gelt workspace/launcher/CI imports this crate.
[workspace]

[dependencies]
codex-core = { git = "https://github.com/openai/codex", rev = "0df4aa67781ae45a3c97befa4db48b734afe46d9", default-features = false }
codex-extension-api = { git = "https://github.com/openai/codex", rev = "0df4aa67781ae45a3c97befa4db48b734afe46d9", default-features = false }
codex-features = { git = "https://github.com/openai/codex", rev = "0df4aa67781ae45a3c97befa4db48b734afe46d9", default-features = false }
codex-history = { git = "https://github.com/openai/codex", rev = "0df4aa67781ae45a3c97befa4db48b734afe46d9", default-features = false }
codex-protocol = { git = "https://github.com/openai/codex", rev = "0df4aa67781ae45a3c97befa4db48b734afe46d9", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
uuid = { version = "=1.20.0", default-features = false }

[dev-dependencies]
codex-config = { git = "https://github.com/openai/codex", rev = "0df4aa67781ae45a3c97befa4db48b734afe46d9", default-features = false }
codex-model-provider-info = { git = "https://github.com/openai/codex", rev = "0df4aa67781ae45a3c97befa4db48b734afe46d9", default-features = false }
codex-state = { git = "https://github.com/openai/codex", rev = "0df4aa67781ae45a3c97befa4db48b734afe46d9", default-features = false }

# Git dependencies do not inherit their workspace-root patches.
# Mirror the pinned upstream root, including the SSH-source override.
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
